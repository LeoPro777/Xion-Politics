[project]
name = "sigo-pj-zulia"
version = "1.0.0"
description = "Sistema de Información Geográfica y Operativa - PJ Zulia"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic[email]>=2.6.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "greenlet>=3.0.3",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "google-auth>=2.28.0",
    "structlog>=24.1.0"
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
