version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigo_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - USE_SQLITE=true
      - SECRET_KEY=${SECRET_KEY:-super-secret-jwt-key-replace-in-prod}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-123456789-xxxxxxx.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-GOCSPX-xxxxxxxxxxxxxxxx}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:8000","http://localhost"]}
    volumes:
      - ./sigo_zulia.db:/app/sigo_zulia.db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
